packages:
  - 'core'
  - 'io'
  - 'nar'
  - 'ui'
  - 'metta'
  - 'util'

allowBuilds:
  '@biomejs/biome': true
  '@google/genai': true
  '@parcel/watcher': set this to true or false
  better-sqlite3: true
  esbuild: true
  iconv: true
  koffi: true
  node-icu-charset-detector: true
  onnxruntime-node: false
  protobufjs: false
  sharp: false
  unrs-resolver: set this to true or false

minimumReleaseAgeExclude:
  - uuid@11.1.1
  - qs@6.15.2
  - '@ai-sdk/provider-utils@3.0.98'
  - hono@4.12.21 || 4.12.25 || 4.12.27 || 4.12.34
  - esbuild@0.28.1
  - js-yaml@4.1.2 || 4.3.0
  - protobufjs@7.6.1 || 7.6.3 || 7.6.5
  - '@babel/core@7.29.1'
  - adm-zip@0.6.0
  - brace-expansion@1.1.16 || 1.1.17 || 1.1.18 || 2.1.3 || 2.1.4 || 5.0.7 || 5.0.8 || 5.0.9
  - shell-quote@1.8.5
  - body-parser@2.3.0
  - '@hono/node-server@2.0.5'
  - fast-uri@3.1.3 || 3.1.4 || 3.1.5
  - sharp@0.35.0
  - undici@8.9.0
  - ip-address@10.2.1 || 10.2.2 || 10.3.1
