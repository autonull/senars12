packages:
  - 'core'
  - 'io'
  - 'nar'
  - 'ui'
  - 'metta'

allowBuilds:
  '@biomejs/biome': true
  '@google/genai': true
  '@swc/core': set this to true or false
  better-sqlite3: true
  esbuild: true
  iconv: true
  koffi: true
  node-icu-charset-detector: true
  onnxruntime-node: false
  protobufjs: false
  sharp: false
