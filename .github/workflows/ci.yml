name: ci
on:
  push:
  pull_request:
jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      # The bin/ composition root is a separate tsconfig and its own failure mode.
      - run: pnpm typecheck:bin
      - run: pnpm typecheck:packages
      - run: pnpm lint
      - run: pnpm deps:gate
      # TODO28 §4.2: deps:gate counts cycles and cannot see an inversion.
      - run: pnpm deps:direction
      # TODO29.a A0: provider-dependency detection, and the in-cycle induction inventory.
      - run: pnpm cycle:no-provider
      - run: pnpm induction:inventory
      # TODO20 A1: no export without a consumer (or PUBLIC_API declaration)
      - run: pnpm exports:audit
      # Every declared subpath resolves to a real file.
      - run: pnpm exports:check
      # TODO28 §8.6: one barrel per directory, and it names what it exports.
      - run: pnpm exports:barrels
      # TODO20 §5s: generated docs must match committed output (drift gate)
      - run: pnpm docs:drift
      # TODO28 §8.10: every gate in scripts/lib/gates.ts, including this one.
      - run: pnpm complexity:budget
      - run: pnpm test:unit
  determinism:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Needs no model, and gates the seeded-RNG paths the whole reasoning line
      # of work touches — the cheapest missing gate in the repository.
      - run: pnpm test:determinism
      # TODO28 §7.3: a seeded run must draw no ambient entropy. Math.random and
      # crypto.randomUUID throw for the duration, so an unthreaded component
      # fails the build rather than passing a trace nobody can reproduce.
      - run: pnpm test:hermetic
  systemone-slo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:load-sensitive
  systemone-benches:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # F8: TODO16c benchmarks 15–28 in their own job (RL parity files are
      # load-sensitive — a dedicated job avoids the parallel-load flakes).
      - run: pnpm vitest run tests/nar/todo16c-*.test.ts
      # I1 examples smoke
      - run: pnpm tsx examples/systemone-ingress.ts
      - run: pnpm tsx examples/rl-gridworld.ts
      - run: pnpm tsx examples/custom-head.ts
      # F3 mock leg: System One on/off latency + LM-call deltas → .reports/
      - run: pnpm bench:system-one

  arcade-benches:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # TODO17 F1: benches 29–35 (offline legs) + the offline arcade smoke
      - run: pnpm vitest run "tests/nar/todo17-*.test.ts"
      - run: pnpm arcade -- --games snake,tictactoe --arms heuristic,random --episodes 2