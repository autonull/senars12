<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SeNARS Cognitive HUD</title>
  <link rel="stylesheet" href="./core/theme.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.11.0/styles/atom-one-dark.min.css">
</head>
<body>
  <div id="status-bar" style="position:fixed;top:0;left:0;right:0;height:2px;z-index:100;transition:background 0.3s, box-shadow 0.3s;"></div>
  <div id="status-label" style="position:fixed;top:4px;right:8px;font-family:var(--font-data);font-size:0.6rem;color:var(--text-dim);z-index:100;letter-spacing:1px;text-transform:uppercase;"></div>

  <app-layout></app-layout>

  <script type="module">
    import { connect, disconnect } from './core/ws-client.js';
    import { $connectionState } from './core/store.js';

    const bar = document.getElementById('status-bar');
    const label = document.getElementById('status-label');

    const colors = {
      connected: 'background: #00f3ff; box-shadow: 0 0 8px rgba(0,243,255,0.6)',
      connecting: 'background: #ffb000; box-shadow: 0 0 8px rgba(255,176,0,0.4)',
      reconnecting: 'background: #ffb000; box-shadow: 0 0 8px rgba(255,176,0,0.4)',
      disconnected: 'background: #475569; box-shadow: none',
    };

    $connectionState.subscribe((state) => {
      if (bar) bar.setAttribute('style', `position:fixed;top:0;left:0;right:0;height:2px;z-index:100;transition:background 0.3s;${colors[state] ?? colors.disconnected}`);
      if (label) label.textContent = state;
    });

    connect();
  </script>
</body>
</html>
