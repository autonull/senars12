name: ci
# Manual dispatch only — automatic push/PR runs are paused. Every job, step and
# gate below is unchanged, so re-enabling is deleting the two lines below and
# restoring the `on:` block. To run: gh workflow run ci
on:
  workflow_dispatch:
jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      # The bin/ composition root is a separate tsconfig and its own failure mode.
      - run: pnpm typecheck:bin
      - run: pnpm typecheck:packages
      - run: pnpm lint
      - run: pnpm deps:gate
      # TODO28 §4.2: deps:gate counts cycles and cannot see an inversion.
      - run: pnpm deps:direction
      # TODO29.a A2: the reasoning cycle reaches the induction layer through a
      # ModelRule, a TextGenerator and an EmbeddingRuntime — never by import.
      - run: pnpm core:no-lm
      # TODO29.a A5: the cycle path reaches memory through its ports, not the facade.
      - run: pnpm memory:ports
      - run: pnpm attention:write-surface
      - run: pnpm proposal:protocol
      - run: pnpm dispatch:no-wildcard
      - run: pnpm rules:loaded-data
      # TODO29.a A7: every control budget is a declared scope, and every declared
      # scope is spent by a call site.
      - run: pnpm control-budgets
      # TODO29.a A9: a recorded proposal stream is a sufficient fixture. The
      # reduction is pure, the replay path reaches no provider, an incompatible
      # schema version fails loudly, and a stream recorded against R is stale at R+1.
      - run: pnpm replay:proposal
      # TODO29.a A0: provider-dependency detection, and the in-cycle induction inventory.
      # TODO29.a A8: every growing resource declares its owner, its bound, its
      # retention rule, its overflow behaviour and its pressure signal.
      - run: pnpm resource:policy
      - run: pnpm cycle:no-provider
      - run: pnpm induction:inventory
      # TODO29.a A1: every model-backed rule derives without a model; one cycle step.
      - run: pnpm rule:has-fallback
      - run: pnpm gates:one-cycle-path
      # TODO29.a A1: S / S+J / S+P / S+J+P are four complete systems.
      - run: pnpm config:model-matrix
      # TODO29.a A12 step 1: the operator table, the grammar and the serialiser
      # are one surface form, and every kind survives the round trip.
      - run: pnpm terms:canonical
      # TODO30 T2: a Bool atom cannot name a Task; the cascade makes it total.
      - run: pnpm terms:no-bool-task
      # TODO30 U1: ask() answers the asked term, a ground instance of it, or nothing.
      - run: pnpm answer:no-fabrication
      # TODO30 U2: relevance ranks an unchanged store, and the narrowing is measured.
      - run: pnpm relevance:measured
      # TODO30 T3: every narsese string literal parses and re-serialises to itself
      - run: pnpm narsese:literals
      # TODO20 A1: no export without a consumer (or PUBLIC_API declaration)
      - run: pnpm exports:audit
      # Every declared subpath resolves to a real file.
      - run: pnpm exports:check
      # TODO28 §8.6: one barrel per directory, and it names what it exports.
      - run: pnpm exports:barrels
      # TODO20 §5s: generated docs must match committed output (drift gate)
      - run: pnpm docs:drift
      # TODO28 §8.10: every gate in scripts/lib/gates.ts, including this one.
      - run: pnpm complexity:budget
      - run: pnpm test:unit
      # TODO32 integration milestones. Each gate is its own step so a red build
      # names the milestone rather than "tests failed".
      # M1/M3/M6/M7 — composition, the MeTTa tool leg, live WS delegation, and
      # the committed hello-world the getting-started docs are derived from.
      - run: pnpm e2e:pipeline
      # M4 — restart reconstructs the same committed state, at rest and at capacity.
      - run: pnpm persistence:replay
      # M8 — every answer carries a derivation the standalone verifier accepts.
      - run: pnpm derivation:verifiable
      # M5 — reward moves policy, never Truth.
      - run: pnpm reward:policy-only
      # M9 — no contradictory or redundantly nested term reaches committed state.
      - run: pnpm derivation:clean
      # M2 — egress judging is opt-in, bounded, and can only remove: with the
      # flag off the committed set is what an unjudged NAR commits.
      - run: pnpm egress:invariant
  determinism:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Needs no model, and gates the seeded-RNG paths the whole reasoning line
      # of work touches — the cheapest missing gate in the repository.
      - run: pnpm test:determinism
      # TODO28 §7.3: a seeded run must draw no ambient entropy. Math.random and
      # crypto.randomUUID throw for the duration, so an unthreaded component
      # fails the build rather than passing a trace nobody can reproduce.
      - run: pnpm test:hermetic
  systemone-slo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:load-sensitive
  systemone-benches:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # F8: TODO16c benchmarks 15–28 in their own job (RL parity files are
      # load-sensitive — a dedicated job avoids the parallel-load flakes).
      - run: pnpm vitest run tests/nar/todo16c-*.test.ts
      # I1 examples smoke
      - run: pnpm tsx examples/systemone-ingress.ts
      - run: pnpm tsx examples/rl-gridworld.ts
      - run: pnpm tsx examples/custom-head.ts
      # F3 mock leg: System One on/off latency + LM-call deltas → .reports/
      - run: pnpm bench:system-one

  arcade-benches:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # TODO17 F1: benches 29–35 (offline legs) + the offline arcade smoke
      - run: pnpm vitest run "tests/nar/todo17-*.test.ts"
      - run: pnpm arcade -- --games snake,tictactoe --arms heuristic,random --episodes 2