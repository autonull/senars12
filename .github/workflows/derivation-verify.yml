name: derivation-verify
# Manual dispatch only — automatic push/PR runs are paused alongside `ci`.
# Re-enable by restoring the `on:` block (push/pull_request with the path
# filters). To run: gh workflow run derivation-verify
on:
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec vitest run tests/nar/derivation-verifier.test.ts tests/nar/kernel-gates.test.ts
