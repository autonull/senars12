name: derivation-verify
on:
  push:
    paths:
      - 'nar/src/terms/truth.ts'
      - 'nar/src/kernel/**'
      - 'src/kernel/**'
      - 'scripts/verify-derivation.ts'
      - 'tests/nar/derivation-verifier.test.ts'
      - 'tests/nar/kernel-gates.test.ts'
  pull_request:
    paths:
      - 'nar/src/terms/truth.ts'
      - 'nar/src/kernel/**'
      - 'src/kernel/**'
      - 'scripts/verify-derivation.ts'
      - 'tests/nar/derivation-verifier.test.ts'
      - 'tests/nar/kernel-gates.test.ts'
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec vitest run tests/nar/derivation-verifier.test.ts tests/nar/kernel-gates.test.ts
